services:

  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayicim -d dockerdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
  restart-test:
    image: alpine
    restart: unless-stopped
    command: sh -c "echo 'Dayicim ben cokuyorum'; sleep 5; exit 1"

volumes:
  dbdata: