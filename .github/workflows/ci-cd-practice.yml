name: CI CD Practice

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker image build et
        run: docker build -t benim-nginx:test .

      - name: Container calistir
        run: docker run -d --name test-container -p 8080:80 benim-nginx:test

      - name: Uygulamayi test et
        run: |
          sleep 3
          curl -f http://localhost:8080

      - name: Docker Hub login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Image tagle
        run: docker tag benim-nginx:test ${{ secrets.DOCKERHUB_USERNAME }}/benim-nginx:latest

      - name: Docker Hub push
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/benim-nginx:latest

  deploy:
    needs: build-and-test
    runs-on: self-hosted

 

    steps:
      - name: Yeni image'i cek
        run: docker pull baskaynak2001/benim-nginx:latest

      - name: Eski container'i durdur
        run: docker stop registry-test || true

      - name: Eski container'i sil
        run: docker rm registry-test || true

      - name: Yeni container'i calistir
        run: docker run -d --name registry-test -p 8084:80 baskaynak2001/benim-nginx:latest
